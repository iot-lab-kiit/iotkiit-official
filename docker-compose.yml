# ---------------------------------------------------------------------------
# Local testing / Coolify "Docker Compose" build-pack.
#
# For a single Next.js app, Coolify's plain "Dockerfile" build pack is the
# simplest option (it reads ./Dockerfile directly and you set the exposed port
# to 3000). This compose file is here so you can also:
#   * test the production image locally:   docker compose up --build
#   * or point Coolify at this repo and pick the "dockercompose.yaml" pack.
# ---------------------------------------------------------------------------
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: iotkiit-web:latest
    container_name: iotkiit-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    # The Dockerfile already defines a HEALTHCHECK; this mirrors it so `docker
    # compose ps` shows health even when run via compose.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
